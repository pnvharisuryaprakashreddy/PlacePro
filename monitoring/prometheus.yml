# Prometheus Scrape Configuration for PlacePro Campus Placement Portal
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "placepro-server"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "localhost:8080"
          - "host.docker.internal:8080"
        labels:
          environment: "production"
          service: "placepro-tpo-portal"
